<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer — Configuración</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #f5f2ec;
  --surface: #ffffff;
  --card:    #f0ece4;
  --border:  #ddd8ce;
  --accent:  #1a1a2e;
  --red:     #e03535;
  --green:   #1d7a4e;
  --yellow:  #d4940c;
  --muted:   #9a9282;
  --text:    #1a1814;
  --mono:    'DM Mono', monospace;
  --serif:   'Instrument Serif', serif;
  --sans:    'Outfit', sans-serif;
  --sidebar: 260px;
  --left-w:  380px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ══ SIDEBAR ══ */
#sidebar {
  width: var(--sidebar); min-height: 100vh;
  background: var(--accent); color: #fff;
  display: flex; flex-direction: column; flex-shrink: 0;
  position: fixed; left: 0; top: 0; bottom: 0; z-index: 200;
  transform: translateX(calc(-1 * var(--sidebar)));
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
}
#sidebar.open { transform: translateX(0); }
.sb-header { padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; }
.sb-title { font-family: var(--serif); font-style: italic; font-size: 1.3rem; color: rgba(255,255,255,0.85); }
.sb-close { width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.sb-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
.sb-new-group { margin: 14px 16px 6px; width: calc(100% - 32px); font-family: var(--sans); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.04em; padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); border: 1px dashed rgba(255,255,255,0.2); cursor: pointer; transition: all 0.15s; }
.sb-new-group:hover { background: rgba(255,255,255,0.12); color: #fff; }
.sb-groups { padding: 4px 0 20px; }
.sb-group  { margin: 2px 0; }
.sb-group-header { display: flex; align-items: center; gap: 8px; padding: 9px 16px; cursor: pointer; transition: background 0.15s; user-select: none; }
.sb-group-header:hover { background: rgba(255,255,255,0.06); }
.sb-group-header.active-group { background: rgba(255,255,255,0.1); }
.sb-group-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sb-group-name { flex: 1; font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-group-header.active-group .sb-group-name { color: #fff; }
.sb-chevron { font-size: 0.6rem; color: rgba(255,255,255,0.3); transition: transform 0.2s; flex-shrink: 0; }
.sb-group-header.open .sb-chevron { transform: rotate(90deg); }
.sb-group-items { display: none; padding: 2px 0 4px 32px; }
.sb-group-items.open { display: block; }
.sb-item { font-size: 0.8rem; color: rgba(255,255,255,0.5); padding: 6px 16px 6px 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.15s; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sb-item:hover { color: rgba(255,255,255,0.9); }
.sb-item.selected { color: #fff; font-weight: 600; }
.sb-item-time { font-family: var(--mono); font-size: 0.7rem; color: rgba(255,255,255,0.3); flex-shrink: 0; }
.sb-item.selected .sb-item-time { color: rgba(255,255,255,0.55); }
#backdrop { display: none; position: fixed; inset: 0; z-index: 199; background: rgba(0,0,0,0.35); }
#backdrop.visible { display: block; }

/* ══ LAYOUT DOS COLUMNAS ══ */
#appLayout {
  display: flex;
  width: 100%; height: 100vh;
  overflow: hidden;
}

/* ── Columna izquierda: fija, no scrolleable ── */
#leftCol {
  width: var(--left-w);
  min-width: var(--left-w);
  flex-shrink: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 32px 24px 32px;
  border-right: 1px solid var(--border);
  background: var(--bg);
}

/* ── Columna derecha: scrolleable ── */
#rightCol {
  flex: 1;
  height: 100vh;
  overflow-y: auto;
  padding: 32px 28px 80px;
  background: var(--bg);
}

/* Scrollbar sutil en la columna derecha */
#rightCol::-webkit-scrollbar { width: 5px; }
#rightCol::-webkit-scrollbar-track { background: transparent; }
#rightCol::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* Modo cronómetro: ocultar columna derecha, centrar izquierda */
body.stopwatch-mode #appLayout { justify-content: center; }
body.stopwatch-mode #rightCol  { display: none; }
body.stopwatch-mode #leftCol   {
  width: 480px; min-width: 0;
  border-right: none;
  align-items: center;
  justify-content: center;
}

/* ── Header ── */
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 12px; }
.btn-menu { width: 36px; height: 36px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: all 0.15s; flex-shrink: 0; }
.btn-menu:hover { border-color: var(--accent); }
.btn-menu span { display: block; width: 14px; height: 1.5px; background: var(--accent); border-radius: 2px; }
header h1 { font-family: var(--serif); font-size: 2rem; font-style: italic; letter-spacing: -0.02em; line-height: 1; }
header p  { font-size: 0.72rem; color: var(--muted); }
.btn-window { flex-shrink: 0; font-family: var(--sans); font-weight: 600; font-size: 0.75rem; padding: 9px 14px; border-radius: 10px; background: var(--accent); color: #fff; border: none; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.btn-window:hover { background: #2d2d4e; }
.btn-window:active { transform: scale(0.96); }

/* ── Toggle tipo ── */
.type-toggle { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 20px; gap: 4px; flex-shrink: 0; }
.ttab { flex: 1; font-family: var(--sans); font-weight: 600; font-size: 0.78rem; padding: 10px 8px; border: none; background: transparent; border-radius: 9px; color: var(--muted); cursor: pointer; transition: all 0.18s; text-align: center; }
.ttab.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

/* ── Panel control ── */
.control-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; box-shadow: 0 2px 0 var(--border); flex-shrink: 0; }
.control-panel h3 { font-family: var(--serif); font-size: 0.95rem; font-style: italic; color: var(--muted); margin-bottom: 14px; }
.preview-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.preview-time { font-family: var(--mono); font-size: 2rem; font-weight: 400; letter-spacing: 0.04em; color: var(--text); flex-shrink: 0; }
.preview-info { flex: 1; min-width: 0; }
.preview-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview-sub  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

/* Espejo en vivo */
.mirror-wrap { display: none; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.mirror-wrap.visible { display: flex; }
.mirror-time { font-family: var(--mono); font-size: 2.4rem; font-weight: 700; letter-spacing: 0.02em; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.mirror-time.warning  { color: var(--yellow); animation: mBlink 1s step-start infinite; }
.mirror-time.overtime { color: var(--red);    animation: mBlink 1s step-start infinite; }
@keyframes mBlink { 0%,100%{opacity:1} 50%{opacity:0.25} }
.mirror-badge { font-family: var(--mono); font-size: 0.62rem; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; color: var(--muted); white-space: nowrap; }
.mirror-badge.live    { border-color: var(--green);  color: var(--green);  }
.mirror-badge.warning { border-color: var(--yellow); color: var(--yellow); }
.mirror-badge.overtime{ border-color: var(--red);    color: var(--red);    }

.playback-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { font-family: var(--sans); font-weight: 600; font-size: 0.8rem; padding: 9px 18px; border-radius: 9px; border: 1.5px solid transparent; cursor: pointer; transition: all 0.15s; outline: none; }
.btn:active { transform: scale(0.96); }
.btn-solid   { background: var(--accent); color: #fff; }
.btn-solid:hover { background: #2d2d4e; }
.btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-ghost   { background: transparent; color: var(--muted); padding: 9px 12px; }
.btn-ghost:hover { color: var(--red); }

/* ── Columna derecha: grupo activo ── */
.group-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.group-bar-name { font-family: var(--serif); font-size: 1.25rem; font-style: italic; display: flex; align-items: center; gap: 8px; }
.group-bar-dot  { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.group-bar-actions { display: flex; gap: 6px; }
.badge { font-family: var(--mono); font-size: 0.68rem; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; color: var(--muted); }

/* ── Crear temporizador ── */
.create-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 2px 0 var(--border); }
.create-card h3 { font-family: var(--serif); font-size: 0.95rem; font-style: italic; color: var(--muted); margin-bottom: 12px; }
.input-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 70px; }
.field label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.field input { background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: 1rem; padding: 9px 8px; outline: none; transition: border-color 0.2s; width: 100%; text-align: center; }
.field input[type="text"] { font-family: var(--sans); text-align: left; }
.field input:focus { border-color: var(--accent); background: #fff; }
.field input::placeholder { color: var(--muted); opacity: 0.6; }
.field input[type=number]::-webkit-inner-spin-button,
.field input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
.field input[type=number] { -moz-appearance: textfield; }
.btn-add { width: 100%; font-family: var(--sans); font-weight: 600; font-size: 0.82rem; padding: 10px; border-radius: 10px; background: transparent; color: var(--green); border: 1.5px solid #b5d9c8; cursor: pointer; transition: all 0.15s; }
.btn-add:hover { background: rgba(29,122,78,0.06); }

/* ── Lista timers ── */
.saved-list { display: flex; flex-direction: column; gap: 7px; }
.empty { text-align: center; padding: 26px 16px; border: 1.5px dashed var(--border); border-radius: 14px; color: var(--muted); font-size: 0.82rem; line-height: 1.7; }
.empty strong { display: block; font-size: 1.5rem; margin-bottom: 8px; opacity: 0.25; }
.t-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 0 var(--border); transition: border-color 0.2s, box-shadow 0.18s, opacity 0.18s; cursor: pointer; }
.t-card:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(26,26,46,0.08); }
.t-card.selected { border-color: var(--accent); background: rgba(26,26,46,0.025); }
.t-card.dragging  { opacity: 0.4; cursor: grabbing; box-shadow: none; }
.t-card.drag-over { border-color: var(--accent); border-style: dashed; background: rgba(26,26,46,0.04); }
.drag-handle { cursor: grab; color: var(--muted); font-size: 0.85rem; padding: 2px 4px; flex-shrink: 0; touch-action: none; user-select: none; line-height: 1; }
.drag-handle:active { cursor: grabbing; }
.t-card.editing { border-color: var(--accent); background: #fff; flex-wrap: wrap; cursor: default; }
.t-edit-row { display: flex; gap: 6px; flex: 1; align-items: center; flex-wrap: wrap; }
.t-edit-input { font-family: var(--sans); font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; outline: none; background: var(--card); color: var(--text); flex: 1; min-width: 90px; }
.t-edit-input:focus { border-color: var(--accent); background: #fff; }
.t-edit-num { font-family: var(--mono); font-size: 0.85rem; border: 1px solid var(--border); border-radius: 7px; padding: 5px 6px; outline: none; background: var(--card); color: var(--text); width: 46px; text-align: center; }
.t-edit-num:focus { border-color: var(--accent); background: #fff; }
.t-edit-num::-webkit-inner-spin-button, .t-edit-num::-webkit-outer-spin-button { -webkit-appearance: none; }
.t-edit-num { -moz-appearance: textfield; }
.t-edit-sep { color: var(--muted); font-family: var(--mono); font-size: 0.9rem; }
.t-edit-actions { display: flex; gap: 5px; flex-shrink: 0; }
.t-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.t-info { flex: 1; min-width: 0; }
.t-name { font-weight: 600; font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-time { font-family: var(--mono); font-size: 1rem; font-weight: 500; color: var(--text); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.t-actions { display: flex; gap: 4px; }
.icon-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.icon-btn:hover { border-color: var(--accent); color: var(--text); }
.icon-btn.del:hover  { border-color: var(--red);   color: var(--red);   background: rgba(224,53,53,0.06); }
.icon-btn.save:hover { border-color: var(--green);  color: var(--green); }

/* ── Secciones ── */
.section-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; cursor: pointer; user-select: none; }
.section-divider-line { flex: 1; height: 1px; }
.section-divider-label { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; padding: 3px 10px; border-radius: 20px; border: 1.5px solid; transition: opacity 0.15s; }
.section-divider-chevron { font-size: 0.55rem; transition: transform 0.22s; opacity: 0.6; }
.section-divider.collapsed .section-divider-chevron { transform: rotate(-90deg); }
.section-divider:hover .section-divider-label { opacity: 0.8; }
.section-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.section-divider:hover .section-actions { opacity: 1; }
.section-icon-btn { width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.section-icon-btn:hover { border-color: var(--accent); color: var(--text); }
.section-icon-btn.del:hover { border-color: var(--red); color: var(--red); background: rgba(224,53,53,0.06); }
.section-timers { display: flex; flex-direction: column; gap: 7px; }
.section-timers.collapsed { display: none; }
.section-divider.drop-target { background: rgba(26,26,46,0.04); border-radius: 10px; }
.section-divider.drop-target .section-divider-line { opacity: 1 !important; height: 2px !important; }
.section-divider.drop-target .section-divider-label { transform: scale(1.05); box-shadow: 0 0 0 2px currentColor; }

/* ── Modales ── */
.modal-bg { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; }
.modal-bg.visible { display: flex; }
.modal { background: var(--surface); border-radius: 16px; padding: 28px 24px; width: 90%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
.modal h3 { font-family: var(--serif); font-size: 1.2rem; font-style: italic; margin-bottom: 18px; }
.modal-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.modal-field label { font-size: 0.67rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.modal-field input { background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--sans); font-size: 0.95rem; padding: 10px 12px; outline: none; transition: border-color 0.2s; }
.modal-field input:focus { border-color: var(--accent); background: #fff; }
.color-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; transition: transform 0.15s; flex-shrink: 0; }
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.picked { border-color: var(--accent); transform: scale(1.15); }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; }
.modal-actions .btn { flex: 1; }

.no-groups { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.85rem; line-height: 1.8; }
.no-groups strong { display: block; font-size: 2rem; margin-bottom: 10px; opacity: 0.2; }
</style>
</head>
<body>

<div id="backdrop" onclick="closeSidebar()"></div>
<div id="sidebar">
  <div class="sb-header">
    <span class="sb-title">Grupos</span>
    <button class="sb-close" onclick="closeSidebar()">✕</button>
  </div>
  <button class="sb-new-group" onclick="openNewGroupModal()">+ Nuevo grupo</button>
  <div class="sb-groups" id="sbGroups"></div>
</div>

<div id="appLayout">

  <!-- ══ COLUMNA IZQUIERDA: fija ══ -->
  <div id="leftCol">

    <header>
      <div class="header-left">
        <button class="btn-menu" onclick="toggleSidebar()">
          <span></span><span></span><span></span>
        </button>
        <div>
          <h1>Timers</h1>
          <p>Configuración</p>
        </div>
      </div>
      <button class="btn-window" onclick="openPlayerWindow()">⎋ Abrir</button>
    </header>

    <div class="type-toggle">
      <button class="ttab active" id="ttTimer"     onclick="switchType('timer')">⏱ Temporizador</button>
      <button class="ttab"        id="ttStopwatch" onclick="switchType('stopwatch')">⏲ Cronómetro</button>
    </div>

    <div class="control-panel">
      <h3>Ahora</h3>
      <div class="mirror-wrap" id="mirrorWrap">
        <div class="mirror-time" id="mirrorTime">00:00</div>
        <div class="mirror-badge live" id="mirrorBadge">en vivo</div>
      </div>
      <div class="preview-row">
        <div class="preview-time" id="previewTime">--:--</div>
        <div class="preview-info">
          <div class="preview-name" id="previewName">Sin selección</div>
          <div class="preview-sub"  id="previewSub">Selecciona un temporizador</div>
        </div>
      </div>
      <div class="playback-controls">
        <button class="btn btn-solid"   id="btnPlay"  onclick="sendPlay()">▶ Reproducir</button>
        <button class="btn btn-outline" id="btnPause" onclick="sendPause()">⏸ Pausar</button>
        <button class="btn btn-outline" onclick="sendReset()">↺ Reiniciar</button>
        <button class="btn btn-ghost"   onclick="sendStop()">■ Detener</button>
      </div>
    </div>

  </div>

  <!-- ══ COLUMNA DERECHA: scrolleable ══ -->
  <div id="rightCol">
    <div id="groupContent"></div>
  </div>

</div>

<!-- Modal grupo -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Nuevo grupo</h3>
    <div class="modal-field">
      <label>Nombre del grupo</label>
      <input type="text" id="modalGroupName" placeholder="Ej: Reunión semanal…" maxlength="40">
    </div>
    <div class="modal-field">
      <label>Color</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-solid"   onclick="saveGroup()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal sección -->
<div class="modal-bg" id="modalSectionBg">
  <div class="modal">
    <h3 id="modalSectionTitle">Nueva sección</h3>
    <div class="modal-field">
      <label>Nombre de la sección</label>
      <input type="text" id="modalSectionName" placeholder="Ej: Reunión entre semana…" maxlength="40">
    </div>
    <div class="modal-field">
      <label>Color</label>
      <div class="color-picker" id="sectionColorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeSectionModal()">Cancelar</button>
      <button class="btn btn-solid"   onclick="saveSection()">Guardar</button>
    </div>
  </div>
</div>

<script>
const CH       = 'timer_channel_v1';
const CH_BACK  = 'timer_channel_v1_back';
const CH_STATE = 'timer_mirror_state';
const WARN_MS  = 60000;

// ── Datos ──
let data = JSON.parse(localStorage.getItem('timerData_v1') || 'null');
if (!data) {
  const old = JSON.parse(localStorage.getItem('timers_v5') || '[]');
  data = { groups: old.length ? [{ id: Date.now(), name: 'General', color: '#4a6fa5', timers: old }] : [] };
  saveData();
}
let activeGroupId    = data.groups[0]?.id || null;
let activeTimerId    = null;
let appType          = 'timer';
let playerWin        = null;
let playerState      = { status: 'idle' };
let editingTimerId   = null;
let modalEditGroupId = null;
let dragSrcId        = null;

const GROUP_COLORS   = ['#4a6fa5','#c04040','#1d7a4e','#b06020','#7a1a6e','#5a6e1a','#1a6e7a','#6e4a1a'];
const SECTION_COLORS = ['#e03535','#d4940c','#2a6fd4','#1d7a4e','#9b3fbf','#c07020','#1a7a7a','#c04060','#5a6e1a','#6e4a1a'];
let pickedColor        = GROUP_COLORS[0];
let pickedSectionColor = SECTION_COLORS[0];
let modalEditSectionId = null;
let collapsedSections  = {};

function saveData() { localStorage.setItem('timerData_v1', JSON.stringify(data)); }

// ── Utils ──
const pad = n => String(Math.floor(Math.abs(n))).padStart(2,'0');
function fmtMs(ms) {
  const t=Math.floor(ms/1000), s=t%60, m=Math.floor(t/60)%60, h=Math.floor(t/3600);
  return h>0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtLabel(ms) {
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  if (h>0)      return `${h}h ${m%60>0?m%60+'m':''}`.trim();
  if (m===0)    return `${s}s`;
  if (s%60===0) return `${m}m`;
  return `${m}m ${s%60}s`;
}
function getGroup(id) { return data.groups.find(g=>g.id===id); }
function getTimer(gid,tid) { return getGroup(gid)?.timers.find(t=>t.id===tid); }

// ── Referencias DOM cacheadas ──
const elMirrorWrap  = document.getElementById('mirrorWrap');
const elMirrorTime  = document.getElementById('mirrorTime');
const elMirrorBadge = document.getElementById('mirrorBadge');
const elPreviewTime = document.getElementById('previewTime');
const elPreviewName = document.getElementById('previewName');
const elPreviewSub  = document.getElementById('previewSub');
const elBtnPlay     = document.getElementById('btnPlay');
const elBtnPause    = document.getElementById('btnPause');

// ── Espejo: leer estado en vivo del reproductor ──
let mirrorRaf = null;
let lastMirrorStr = '';

function startMirror() { if (mirrorRaf) return; tickMirror(); }
function stopMirror() {
  if (mirrorRaf) cancelAnimationFrame(mirrorRaf);
  mirrorRaf = null;
  elMirrorWrap.classList.remove('visible');
  lastMirrorStr = '';
}

function tickMirror() {
  const raw = localStorage.getItem(CH_STATE);
  if (!raw) { mirrorRaf = requestAnimationFrame(tickMirror); return; }
  try {
    const st = JSON.parse(raw);
    if (st.playerMode === 'idle') { stopMirror(); return; }
    elMirrorWrap.classList.add('visible');
    const age = Date.now() - (st.ts || Date.now());
    let displayMs;
    if (st.playerMode === 'timer') {
      displayMs = Math.max(0, st.running ? st.remaining - age : st.remaining);
    } else {
      displayMs = st.running ? st.elapsed + age : st.elapsed;
    }
    // Solo actualizar DOM si cambió el segundo
    const str = fmtMs(displayMs);
    if (str !== lastMirrorStr) {
      lastMirrorStr = str;
      elMirrorTime.textContent = str;
    }
    const isWarn     = st.playerMode === 'timer' && displayMs <= WARN_MS && displayMs > 0;
    const isOvertime = st.playerMode === 'overtime';
    const isPaused   = !st.running;
    elMirrorTime.className = 'mirror-time' + (isPaused?'':isWarn?' warning':isOvertime?' overtime':'');
    if (isPaused) {
      elMirrorBadge.textContent='pausado'; elMirrorBadge.className='mirror-badge';
    } else if (isWarn) {
      elMirrorBadge.textContent='⚠ último minuto'; elMirrorBadge.className='mirror-badge warning';
    } else if (isOvertime) {
      elMirrorBadge.textContent='tiempo extra'; elMirrorBadge.className='mirror-badge overtime';
    } else {
      elMirrorBadge.textContent='en vivo'; elMirrorBadge.className='mirror-badge live';
    }
  } catch(e) {}
  mirrorRaf = requestAnimationFrame(tickMirror);
}

// Listener reactivo — reemplaza setInterval
window.addEventListener('storage', e => {
  if (e.key === CH_STATE) {
    try {
      const st = JSON.parse(e.newValue);
      if (st && st.playerMode !== 'idle') startMirror(); else stopMirror();
    } catch(e) {}
  }
  if (e.key === CH_BACK) {
    try {
      const m = JSON.parse(e.newValue);
      if (m.status) { playerState.status = m.status; updatePlaybackControls(); }
    } catch(e) {}
  }
});

// ── Sidebar ──
function toggleSidebar() {
  const open = document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('visible', open);
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('visible');
}
function renderSidebar() {
  const el = document.getElementById('sbGroups');
  if (!data.groups.length) {
    el.innerHTML = '<div style="padding:16px;font-size:0.75rem;color:rgba(255,255,255,0.25);text-align:center">Sin grupos.<br>Crea uno arriba.</div>';
    return;
  }
  el.innerHTML = data.groups.map(g => `
    <div class="sb-group">
      <div class="sb-group-header ${activeGroupId===g.id?'active-group open':''}" onclick="selectGroup(${g.id})">
        <div class="sb-group-dot" style="background:${g.color}"></div>
        <span class="sb-group-name">${g.name}</span>
        <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-group-items ${activeGroupId===g.id?'open':''}">
        ${(g.timers||[]).map(t=>`
          <div class="sb-item ${activeTimerId===t.id&&activeGroupId===g.id?'selected':''}"
               onclick="selectTimer(${g.id},${t.id});closeSidebar()">
            <span style="overflow:hidden;text-overflow:ellipsis">${t.name}</span>
            <span class="sb-item-time">${fmtMs(t.ms)}</span>
          </div>`).join('')}
        ${!g.timers?.length ? '<div style="font-size:0.72rem;color:rgba(255,255,255,0.2);padding:4px 0">Sin timers</div>' : ''}
      </div>
    </div>`).join('');
}
function selectGroup(id) {
  activeGroupId=id; activeTimerId=null;
  updatePreview(); renderSidebar(); renderGroupContent();
}

// ── Modal sección ──
function openNewSectionModal(editId=null) {
  modalEditSectionId = editId;
  const g = getGroup(activeGroupId);
  const s = editId ? g?.sections?.find(x=>x.id===editId) : null;
  document.getElementById('modalSectionTitle').textContent = editId ? 'Editar sección' : 'Nueva sección';
  document.getElementById('modalSectionName').value = s ? s.name : '';
  pickedSectionColor = s ? s.color : SECTION_COLORS[0];
  renderSectionColorPicker();
  document.getElementById('modalSectionBg').classList.add('visible');
  setTimeout(()=>document.getElementById('modalSectionName').focus(), 50);
}
function closeSectionModal() { document.getElementById('modalSectionBg').classList.remove('visible'); modalEditSectionId=null; }
function renderSectionColorPicker() {
  document.getElementById('sectionColorPicker').innerHTML = SECTION_COLORS.map(c =>
    `<div class="color-swatch ${c===pickedSectionColor?'picked':''}" style="background:${c}" onclick="pickSectionColor('${c}')"></div>`
  ).join('');
}
function pickSectionColor(c) { pickedSectionColor=c; renderSectionColorPicker(); }
function saveSection() {
  const name = document.getElementById('modalSectionName').value.trim();
  if (!name) return;
  const g = getGroup(activeGroupId);
  if (!g) return;
  if (!g.sections) g.sections = [];
  if (modalEditSectionId) {
    const s = g.sections.find(x=>x.id===modalEditSectionId);
    if (s) { s.name=name; s.color=pickedSectionColor; }
  } else {
    g.sections.push({ id: Date.now(), name, color: pickedSectionColor });
  }
  saveData(); closeSectionModal(); renderTimerList();
}
function deleteSection(sid) {
  if (!confirm('¿Eliminar esta sección? Los temporizadores quedarán sin sección.')) return;
  const g = getGroup(activeGroupId);
  if (!g) return;
  g.sections = (g.sections||[]).filter(s=>s.id!==sid);
  (g.timers||[]).forEach(t=>{ if(t.sectionId===sid) delete t.sectionId; });
  delete collapsedSections[sid];
  saveData(); renderTimerList();
}
function toggleSection(sid) { collapsedSections[sid]=!collapsedSections[sid]; renderTimerList(); }

// ── Modal grupo ──
function openNewGroupModal(editId=null) {
  modalEditGroupId = editId;
  const g = editId ? getGroup(editId) : null;
  document.getElementById('modalTitle').textContent = editId ? 'Editar grupo' : 'Nuevo grupo';
  document.getElementById('modalGroupName').value   = g ? g.name : '';
  pickedColor = g ? g.color : GROUP_COLORS[0];
  renderColorPicker();
  document.getElementById('modalBg').classList.add('visible');
  setTimeout(()=>document.getElementById('modalGroupName').focus(), 50);
}
function closeModal() { document.getElementById('modalBg').classList.remove('visible'); modalEditGroupId=null; }
function renderColorPicker() {
  document.getElementById('colorPicker').innerHTML = GROUP_COLORS.map(c =>
    `<div class="color-swatch ${c===pickedColor?'picked':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join('');
}
function pickColor(c) { pickedColor=c; renderColorPicker(); }
function saveGroup() {
  const name = document.getElementById('modalGroupName').value.trim();
  if (!name) return;
  if (modalEditGroupId) {
    const g = getGroup(modalEditGroupId);
    if (g) { g.name=name; g.color=pickedColor; }
  } else {
    const g = { id: Date.now(), name, color: pickedColor, timers: [] };
    data.groups.push(g);
    activeGroupId=g.id; activeTimerId=null;
  }
  saveData(); closeModal(); renderSidebar(); renderGroupContent(); updatePreview();
}
function deleteGroup(id) {
  if (!confirm('¿Eliminar este grupo y todos sus temporizadores?')) return;
  data.groups = data.groups.filter(g=>g.id!==id);
  if (activeGroupId===id) { activeGroupId=data.groups[0]?.id||null; activeTimerId=null; }
  saveData(); renderSidebar(); renderGroupContent(); updatePreview();
}

// ── Contenido grupo (columna derecha) ──
function renderGroupContent() {
  const el = document.getElementById('groupContent');
  if (!activeGroupId) {
    el.innerHTML = `<div class="no-groups"><strong>☰</strong>Abre el menú y crea un grupo para empezar.</div>`;
    return;
  }
  const g = getGroup(activeGroupId);
  if (!g) { el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="group-bar">
      <div class="group-bar-name">
        <span class="group-bar-dot" style="background:${g.color}"></span>${g.name}
      </div>
      <div class="group-bar-actions">
        <span class="badge">${g.timers?.length||0}</span>
        <button class="icon-btn" title="Nueva sección" onclick="openNewSectionModal()" style="font-size:0.7rem">Sc+</button>
        <button class="icon-btn" title="Editar grupo" onclick="openNewGroupModal(${g.id})">✎</button>
        <button class="icon-btn del" title="Eliminar grupo" onclick="deleteGroup(${g.id})">✕</button>
      </div>
    </div>
    <div class="create-card">
      <h3>Nuevo temporizador</h3>
      <div class="input-row">
        <div class="field" style="flex:2;min-width:130px">
          <label>Nombre</label>
          <input type="text" id="inName" placeholder="Pomodoro, Discurso…">
        </div>
        <div class="field">
          <label>Horas</label>
          <input type="number" id="inHr" min="0" max="23" value="0">
        </div>
        <div class="field">
          <label>Min</label>
          <input type="number" id="inMin" min="0" max="59" value="0">
        </div>
        <div class="field">
          <label>Seg</label>
          <input type="number" id="inSec" min="0" max="59" value="0">
        </div>
      </div>
      ${(g.sections||[]).length ? `
      <div class="field" style="margin-bottom:10px">
        <label>Sección</label>
        <select id="inSection" style="background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:0.9rem;padding:9px 8px;outline:none;width:100%">
          <option value="">— Sin sección —</option>
          ${(g.sections||[]).map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}
        </select>
      </div>` : ''}
      <button class="btn-add" onclick="addTimer()">+ Guardar temporizador</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  `;
  renderTimerList();
}

// ── Lista timers con secciones ──
function renderTimerList() {
  const el = document.getElementById('savedList');
  if (!el) return;
  const g = getGroup(activeGroupId);
  if (!g) return;
  if (!g.timers?.length) {
    el.innerHTML = `<div class="empty"><strong>⏱</strong>Sin temporizadores.<br>Crea uno arriba.</div>`;
    return;
  }
  const sections = g.sections || [];

  function timerCard(t) {
    if (editingTimerId === t.id) {
      const h=Math.floor(t.ms/3600000), m=Math.floor((t.ms%3600000)/60000), s=Math.floor((t.ms%60000)/1000);
      return `
        <div class="t-card editing" data-id="${t.id}">
          <div class="t-dot" style="background:${g.color}"></div>
          <div class="t-edit-row">
            <input class="t-edit-input" id="editName_${t.id}" value="${t.name}" placeholder="Nombre">
            <input class="t-edit-num" id="editHr_${t.id}"  type="number" min="0" max="23" value="${h}" title="Horas">
            <span class="t-edit-sep">h</span>
            <input class="t-edit-num" id="editMin_${t.id}" type="number" min="0" max="59" value="${m}" title="Min">
            <span class="t-edit-sep">m</span>
            <input class="t-edit-num" id="editSec_${t.id}" type="number" min="0" max="59" value="${s}" title="Seg">
            <span class="t-edit-sep">s</span>
          </div>
          <div class="t-edit-actions">
            <button class="icon-btn save" onclick="saveEditTimer(${t.id})">✓</button>
            <button class="icon-btn"      onclick="cancelEdit()">✕</button>
          </div>
        </div>`;
    }
    const sec = sections.find(s=>s.id===t.sectionId);
    const dotColor = sec ? sec.color : g.color;
    return `
      <div class="t-card ${activeTimerId===t.id?'selected':''}" data-id="${t.id}" draggable="true"
           ondragstart="onDragStart(event,${t.id})" ondragover="onDragOver(event,${t.id})"
           ondragleave="onDragLeave(event)" ondrop="onDrop(event,${t.id})" ondragend="onDragEnd()"
           onclick="selectTimer(${g.id},${t.id})">
        <div class="drag-handle" title="Arrastrar" onmousedown="event.stopPropagation()">⠿</div>
        <div class="t-dot" style="background:${dotColor}"></div>
        <div class="t-info"><div class="t-name">${t.name}</div></div>
        <div class="t-time">${fmtMs(t.ms)}</div>
        <div class="t-actions">
          <button class="icon-btn" title="Reproducir" onclick="event.stopPropagation();selectTimer(${g.id},${t.id});sendPlay()">▶</button>
          <button class="icon-btn" title="Editar" onclick="event.stopPropagation();startEdit(${t.id})">✎</button>
          <button class="icon-btn del" title="Eliminar" onclick="event.stopPropagation();deleteTimer(${g.id},${t.id})">✕</button>
        </div>
      </div>`;
  }

  let html = '';
  if (!sections.length) {
    html = g.timers.map(timerCard).join('');
  } else {
    sections.forEach(s => {
      const timers = g.timers.filter(t=>t.sectionId===s.id);
      const col = s.color || '#4a6fa5';
      const isCollapsed = !!collapsedSections[s.id];
      html += `
        <div class="section-divider ${isCollapsed?'collapsed':''}" data-section-id="${s.id}"
             onclick="toggleSection(${s.id})"
             ondragover="onSectionDragOver(event,${s.id})"
             ondragleave="onSectionDragLeave(event)"
             ondrop="onSectionDrop(event,${s.id})">
          <div class="section-divider-line" style="background:${col};opacity:0.25"></div>
          <div class="section-divider-label" style="color:${col};border-color:${col};background:${col}18">
            <span class="section-divider-chevron">▼</span>
            ${s.name}
            <span style="font-family:var(--mono);font-size:0.6rem;opacity:0.6">${timers.length}</span>
          </div>
          <div class="section-divider-line" style="background:${col};opacity:0.25"></div>
          <div class="section-actions" onclick="event.stopPropagation()">
            <button class="section-icon-btn" onclick="openNewSectionModal(${s.id})">✎</button>
            <button class="section-icon-btn del" onclick="deleteSection(${s.id})">✕</button>
          </div>
        </div>
        <div class="section-timers ${isCollapsed?'collapsed':''}">
          ${timers.length ? timers.map(timerCard).join('') : '<div class="empty" style="padding:14px 16px"><span style="opacity:0.3">Sin temporizadores en esta sección</span></div>'}
        </div>`;
    });
    const unsectioned = g.timers.filter(t=>!t.sectionId||!sections.find(s=>s.id===t.sectionId));
    if (unsectioned.length) {
      html += `
        <div class="section-divider" style="cursor:default;margin-top:16px" data-section-id="null"
             ondragover="onSectionDragOver(event,null)" ondragleave="onSectionDragLeave(event)" ondrop="onSectionDrop(event,null)">
          <div class="section-divider-line" style="background:var(--border)"></div>
          <div class="section-divider-label" style="color:var(--muted);border-color:var(--border);background:var(--card)">
            sin sección <span style="font-family:var(--mono);font-size:0.6rem;opacity:0.6">${unsectioned.length}</span>
          </div>
          <div class="section-divider-line" style="background:var(--border)"></div>
        </div>
        <div class="section-timers">${unsectioned.map(timerCard).join('')}</div>`;
    }
  }
  el.innerHTML = html;
}

// ── Drag & Drop con referencias cacheadas ──
let lastDragOverCard = null, lastDragOverSection = null;

function onDragStart(e, id) {
  dragSrcId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => { const el=document.querySelector(`[data-id="${id}"]`); if(el) el.classList.add('dragging'); }, 0);
}
function clearDragOver() {
  if (lastDragOverCard)    { lastDragOverCard.classList.remove('drag-over');     lastDragOverCard=null; }
  if (lastDragOverSection) { lastDragOverSection.classList.remove('drop-target'); lastDragOverSection=null; }
}
function onDragOver(e, id) {
  if (id===dragSrcId) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  const el=document.querySelector(`[data-id="${id}"]`);
  if (el===lastDragOverCard) return;
  clearDragOver(); lastDragOverCard=el; if(el) el.classList.add('drag-over');
}
function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
  if (lastDragOverCard===e.currentTarget) lastDragOverCard=null;
}
function onDrop(e, targetId) {
  e.preventDefault(); clearDragOver();
  if (dragSrcId===targetId) return;
  const g=getGroup(activeGroupId); if(!g) return;
  const si=g.timers.findIndex(t=>t.id===dragSrcId), ti=g.timers.findIndex(t=>t.id===targetId);
  if (si<0||ti<0) return;
  const tSec=g.timers[ti].sectionId||null;
  if (tSec) g.timers[si].sectionId=tSec; else delete g.timers[si].sectionId;
  const [moved]=g.timers.splice(si,1); g.timers.splice(ti,0,moved);
  saveData(); renderTimerList(); renderSidebar();
}
function onDragEnd() {
  dragSrcId=null; clearDragOver();
  document.querySelectorAll('.t-card.dragging').forEach(c=>c.classList.remove('dragging'));
}
function onSectionDragOver(e, sid) {
  if (!dragSrcId) return;
  e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect='move';
  const key=sid===null?'null':sid;
  const el=document.querySelector(`[data-section-id="${key}"]`);
  if (el===lastDragOverSection) return;
  clearDragOver(); lastDragOverSection=el; if(el) el.classList.add('drop-target');
}
function onSectionDragLeave(e) {
  e.currentTarget.classList.remove('drop-target');
  if (lastDragOverSection===e.currentTarget) lastDragOverSection=null;
}
function onSectionDrop(e, sid) {
  e.preventDefault(); e.stopPropagation(); clearDragOver();
  if (!dragSrcId) return;
  const g=getGroup(activeGroupId); if(!g) return;
  const t=g.timers.find(x=>x.id===dragSrcId); if(!t) return;
  if (sid===null) delete t.sectionId; else t.sectionId=sid;
  saveData(); renderTimerList(); renderSidebar(); dragSrcId=null;
}

// ── CRUD timers ──
function addTimer() {
  if (!activeGroupId) return;
  const g=getGroup(activeGroupId);
  const name=document.getElementById('inName').value.trim()||'Timer';
  const hr=parseInt(document.getElementById('inHr').value)||0;
  const min=parseInt(document.getElementById('inMin').value)||0;
  const sec=parseInt(document.getElementById('inSec').value)||0;
  const ms=(hr*3600+min*60+sec)*1000;
  if (ms<=0) { alert('El tiempo debe ser mayor a 0.'); return; }
  const selEl=document.getElementById('inSection');
  const sectionId=selEl?(parseInt(selEl.value)||null):null;
  const entry={id:Date.now(),name,ms,...(sectionId?{sectionId}:{})};
  g.timers.unshift(entry);
  saveData();
  document.getElementById('inName').value='';
  document.getElementById('inHr').value='0';
  document.getElementById('inMin').value='0';
  document.getElementById('inSec').value='0';
  selectTimer(activeGroupId,entry.id);
  renderTimerList(); renderSidebar();
}
function selectTimer(gid,tid) {
  activeGroupId=gid; activeTimerId=tid;
  updatePreview(); renderTimerList(); renderSidebar();
}
function startEdit(tid) { editingTimerId=tid; renderTimerList(); setTimeout(()=>document.getElementById('editName_'+tid)?.focus(),30); }
function saveEditTimer(tid) {
  const g=getGroup(activeGroupId), t=g?.timers.find(x=>x.id===tid); if(!t) return;
  const name=document.getElementById('editName_'+tid).value.trim()||t.name;
  const hr=parseInt(document.getElementById('editHr_'+tid).value)||0;
  const min=parseInt(document.getElementById('editMin_'+tid).value)||0;
  const sec=parseInt(document.getElementById('editSec_'+tid).value)||0;
  const ms=(hr*3600+min*60+sec)*1000;
  if (ms<=0) { alert('El tiempo debe ser mayor a 0.'); return; }
  t.name=name; t.ms=ms; editingTimerId=null;
  saveData(); if(activeTimerId===tid) updatePreview(); renderTimerList(); renderSidebar();
}
function cancelEdit() { editingTimerId=null; renderTimerList(); }
function deleteTimer(gid,tid) {
  const g=getGroup(gid); if(!g) return;
  g.timers=g.timers.filter(t=>t.id!==tid);
  if(activeTimerId===tid){activeTimerId=null;updatePreview();}
  editingTimerId=null; saveData(); renderTimerList(); renderSidebar();
}

// ── Preview estático ──
function updatePreview() {
  if (appType==='stopwatch') {
    elPreviewTime.textContent='00:00'; elPreviewName.textContent='Cronómetro libre'; elPreviewSub.textContent='Contará hacia arriba desde cero'; return;
  }
  if (!activeTimerId) {
    elPreviewTime.textContent='--:--'; elPreviewName.textContent='Sin selección'; elPreviewSub.textContent='Selecciona un temporizador'; return;
  }
  const t=getTimer(activeGroupId,activeTimerId); if(!t) return;
  elPreviewTime.textContent=fmtMs(t.ms); elPreviewName.textContent=t.name; elPreviewSub.textContent=fmtLabel(t.ms);
}

// ── Toggle tipo ──
function switchType(type) {
  appType=type;
  document.getElementById('ttTimer').classList.toggle('active', type==='timer');
  document.getElementById('ttStopwatch').classList.toggle('active', type==='stopwatch');
  // Mostrar/ocultar columna derecha y centrar según modo
  if (type==='stopwatch') {
    document.body.classList.add('stopwatch-mode');
  } else {
    document.body.classList.remove('stopwatch-mode');
  }
  updatePreview();
}

// ── Ventana reproductor ──
function openPlayerWindow() {
  const url=new URL('player.html',location.href).href;
  playerWin=window.open(url,'timer_player','width=900,height=600,menubar=no,toolbar=no,location=no,status=no');
}
function broadcast(msg) { localStorage.setItem(CH, JSON.stringify({...msg,_t:Date.now()})); }

// ── Controles de reproducción ──
function updatePlaybackControls() {
  const s=playerState.status;
  if (s==='playing') {
    elBtnPlay.style.display='none';
    elBtnPause.className='btn btn-solid';
    elBtnPause.textContent='⏸ Pausar';
    elBtnPause.onclick=sendPause;
  } else if (s==='paused') {
    elBtnPlay.style.display='none';
    elBtnPause.className='btn btn-solid';
    elBtnPause.textContent='▶ Reanudar';
    elBtnPause.onclick=sendPause;
  } else {
    elBtnPlay.style.display='';
    elBtnPlay.className='btn btn-solid';
    elBtnPause.className='btn btn-outline';
    elBtnPause.textContent='⏸ Pausar';
    elBtnPause.onclick=sendPause;
  }
}

function sendPlay() {
  if (!playerWin||playerWin.closed) { openPlayerWindow(); setTimeout(_doPlay,800); return; }
  _doPlay();
}
function _doPlay() {
  if (appType==='stopwatch') {
    broadcast({cmd:'play',mode:'stopwatch',name:'Cronómetro',totalMs:0});
  } else {
    if (!activeTimerId) { alert('Selecciona un temporizador primero.'); return; }
    const t=getTimer(activeGroupId,activeTimerId); if(!t) return;
    broadcast({cmd:'play',mode:'timer',name:t.name,totalMs:t.ms});
  }
  playerState.status='playing'; updatePlaybackControls(); startMirror();
}
function sendPause() {
  broadcast({cmd:'pause'});
  playerState.status=playerState.status==='playing'?'paused':'playing';
  updatePlaybackControls();
}
function sendReset() { broadcast({cmd:'reset'}); playerState.status='paused'; updatePlaybackControls(); }
function sendStop()  { broadcast({cmd:'stop'});  playerState.status='idle';   updatePlaybackControls(); stopMirror(); }

// ── Init ──
renderSidebar();
renderGroupContent();
updatePreview();
updatePlaybackControls();

try {
  const st=JSON.parse(localStorage.getItem(CH_STATE)||'null');
  if (st&&st.playerMode!=='idle') startMirror();
} catch(e) {}

document.getElementById('modalGroupName').addEventListener('keydown',e=>{ if(e.key==='Enter') saveGroup(); if(e.key==='Escape') closeModal(); });
document.getElementById('modalSectionName').addEventListener('keydown',e=>{ if(e.key==='Enter') saveSection(); if(e.key==='Escape') closeSectionModal(); });
</script>
</body>
